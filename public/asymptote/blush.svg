<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Blush">
  <defs>
    <!-- Soft blush gradient -->
    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB7D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFB7D0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .blush { opacity: 0.9; }
  </style>

  <!-- blush left -->
  <circle class="blush" cx="44" cy="66" r="6" fill="url(#blushGrad)" />
  <!-- blush right -->
  <circle class="blush" cx="76" cy="66" r="6" fill="url(#blushGrad)" />

</svg>