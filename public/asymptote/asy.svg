<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Asymptote character">
  <defs>
    <!-- Radial gradient for the dot body (soft) -->
    <radialGradient id="dotBody" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FFF0E6"/>
      <stop offset="55%" stop-color="#F5DCE6"/>
      <stop offset="100%" stop-color="#E6E0FF"/>
    </radialGradient>

    <!-- Soft blush gradient -->
    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB7D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFB7D0" stop-opacity="0"/>
    </radialGradient>

    <!-- Shadow under the dot -->
    <radialGradient id="shadow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    /* Eyes and mouth */
    .eye { fill: #2E2B3A; }
    .mouth { fill: none; stroke: #2E2B3A; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

    /* Blush */
    .blush { opacity: 0.9; }
  </style>

  <!-- shadow under the dot -->
  <ellipse cx="60" cy="85" rx="23" ry="8" fill="url(#shadow)" opacity="0.6" />

  <!-- dot group: body, blush, face elements -->
  <g class="dot">
    <!-- Dot body -->
    <circle cx="60" cy="60" r="22" fill="url(#dotBody)" stroke="rgba(46,43,58,0.04)" stroke-width="0.75"/>

    <!-- blush left -->
    <circle class="blush" cx="44" cy="66" r="6" fill="url(#blushGrad)" />
    <!-- blush right -->
    <circle class="blush" cx="76" cy="66" r="6" fill="url(#blushGrad)" />

    <!-- eyes -->
    <ellipse class="eye" cx="50" cy="57" rx="3.4" ry="4.9"/>
    <ellipse class="eye" cx="70" cy="57" rx="3.4" ry="4.9"/>

    <!-- mouth (simple smile) -->
    <path class="mouth" d="M 52.5 67.5 Q 60 73.5 67.5 67.5" stroke-linecap="round" stroke-width="3" fill="none" />
  </g>

</svg>
